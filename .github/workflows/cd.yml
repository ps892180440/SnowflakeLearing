name: dbt CD - Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'app/dbt_finance/**'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ACCOUNTADMIN
  SNOWFLAKE_WAREHOUSE: COMPUTE_WH
  SNOWFLAKE_DATABASE: TEST_SNOWFLAKE_LEANING
  DBT_PROFILES_DIR: ./app/dbt_finance

jobs:
  dbt-cd:
    name: dbt Run + Test (Prod)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.9.*

      - name: Override profiles.yml for CD
        run: |
          cat > app/dbt_finance/profiles.yml <<'EOF'
          dbt_finance:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: "SCHM_F_SNOWLEARN_01"
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps --project-dir app/dbt_finance

      - name: dbt run (prod)
        run: dbt run --project-dir app/dbt_finance --target prod

      - name: dbt test (prod)
        run: dbt test --project-dir app/dbt_finance --target prod

      - name: Post deploy summary
        if: always()
        run: |
          echo "## dbt Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployer**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
