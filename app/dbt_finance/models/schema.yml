version: 2

models:
  - name: stg_raw_trade_orders
    description: "Cleaned raw trade orders with standardized fields and computed total"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: direction
        tests:
          - accepted_values:
              values: ['BUY', 'SELL']
      - name: order_type
        tests:
          - accepted_values:
              values: ['LIMIT', 'MARKET']
      - name: status
        tests:
          - accepted_values:
              values: ['FILLED', 'PARTIAL', 'CANCELLED']
      - name: quantity
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_raw_stock_quotes
    description: "Cleaned stock quotes with computed daily change metrics"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null

  - name: stg_raw_fund_nav
    description: "Cleaned fund NAV data with percentage return"
    columns:
      - name: fund_code
        tests:
          - not_null
      - name: nav_date
        tests:
          - not_null

  - name: stg_dim_account
    description: |
      ## Account Dimension (Staging)

      Cleaned and deduplicated account dimension table from source system.
      Uses row_number to keep only the latest record per account_id.

      ### Business Rules
      - Deduplication: keeps latest record per account_id (by etl_updated_at)
      - risk_level and account_type are uppercased and trimmed
      - account_age_days is computed from open_date to current date

    columns:
      - name: account_key
        description: "Surrogate key for the account record"
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Natural business key identifying the account"
        tests:
          - unique
          - not_null
      - name: client_name
        description: "Full name of the account holder"
      - name: risk_level
        description: "Client risk classification (LOW, MEDIUM, HIGH)"
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH']
      - name: account_type
        description: "Type of trading account (e.g. INDIVIDUAL, INSTITUTIONAL)"
      - name: open_date
        description: "Date the account was opened"
      - name: is_active
        description: "Whether the account is currently active"
      - name: account_age_days
        description: "Number of days since the account was opened (computed field)"
      - name: etl_updated_at
        description: "Timestamp of the last ETL update for this record"

  - name: stg_dim_security
    description: "Cleaned security dimension with listing age"
    columns:
      - name: security_key
        tests:
          - unique
          - not_null
      - name: symbol
        tests:
          - unique
          - not_null

  - name: int_trade_enriched
    description: "Trade orders enriched with account and security dimensions"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: client_name
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_security')
              field: symbol

  - name: mart_client_trading_summary
    description: "Per-client trading activity summary with fill rates and volume"
    columns:
      - name: account_id
        tests:
          - not_null
      - name: fill_rate_pct
        tests:
          - not_null

  - name: mart_security_daily_performance
    description: "Daily security performance with price trend and volume tier"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: price_trend
        tests:
          - accepted_values:
              values: ['STRONG_UP', 'UP', 'FLAT', 'DOWN', 'STRONG_DOWN']
      - name: volume_tier
        tests:
          - accepted_values:
              values: ['VERY_HIGH', 'HIGH', 'MEDIUM', 'LOW']

  - name: mart_risk_exposure_report
    description: "Per-client per-security risk exposure with alert flags"
    columns:
      - name: account_id
        tests:
          - not_null
      - name: exposure_level
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']
