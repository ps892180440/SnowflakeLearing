version: 2

sources:
  - name: landing
    database: TEST_SNOWFLAKE_LEANING
    schema: SCHM_L_SNOWLEARN_01
    description: "Landing zone - raw ingested data from upstream systems"
    tables:
      - name: RAW_TRADE_ORDERS
        description: "Raw trade orders ingested from S3 batch files"
        columns:
          - name: ORDER_ID
            description: "Unique order identifier from source system"
          - name: ACCOUNT_ID
            description: "Client account ID"
          - name: SYMBOL
            description: "Security ticker symbol"
          - name: ORDER_TYPE
            description: "Order type: LIMIT or MARKET"
          - name: DIRECTION
            description: "Trade direction: BUY or SELL"
          - name: QUANTITY
            description: "Number of shares"
          - name: PRICE
            description: "Order price per share"
          - name: ORDER_TIME
            description: "Timestamp when order was placed"
          - name: STATUS
            description: "Order status: FILLED, PARTIAL, CANCELLED"
          - name: SOURCE_FILE
            description: "S3 path of the source file"
          - name: INGESTION_TS
            description: "Timestamp when record was ingested"

      - name: RAW_STOCK_QUOTES
        description: "Raw daily OHLCV stock price quotes"
        columns:
          - name: SYMBOL
            description: "Security ticker symbol"
          - name: TRADE_DATE
            description: "Trading date"
          - name: OPEN_PRICE
            description: "Opening price"
          - name: HIGH_PRICE
            description: "Intraday high"
          - name: LOW_PRICE
            description: "Intraday low"
          - name: CLOSE_PRICE
            description: "Closing price"
          - name: VOLUME
            description: "Daily trading volume"

      - name: RAW_FUND_NAV
        description: "Raw daily fund net asset value data"
        columns:
          - name: FUND_CODE
            description: "Fund identifier"
          - name: NAV_DATE
            description: "NAV calculation date"
          - name: UNIT_NAV
            description: "NAV per unit"
          - name: ACCUMULATED_NAV
            description: "Accumulated NAV since inception"
          - name: DAILY_RETURN
            description: "Daily return rate"

  - name: foundation
    database: TEST_SNOWFLAKE_LEANING
    schema: SCHM_F_SNOWLEARN_01
    description: "Foundation layer - dimension and fact tables"
    tables:
      - name: DIM_ACCOUNT
        description: "Account dimension - client info, risk level, account type"
        columns:
          - name: ACCOUNT_KEY
            description: "Surrogate key (auto-increment)"
          - name: ACCOUNT_ID
            description: "Business account identifier"
          - name: CLIENT_NAME
            description: "Client name"
          - name: RISK_LEVEL
            description: "Risk classification: LOW, MEDIUM, HIGH"
          - name: ACCOUNT_TYPE
            description: "Account type: INDIVIDUAL or INSTITUTIONAL"
          - name: OPEN_DATE
            description: "Account opening date"
          - name: IS_ACTIVE
            description: "Whether account is currently active"

      - name: DIM_SECURITY
        description: "Security dimension - stock info, sector, industry"
        columns:
          - name: SECURITY_KEY
            description: "Surrogate key (auto-increment)"
          - name: SYMBOL
            description: "Ticker symbol"
          - name: SECURITY_NAME
            description: "Full security name"
          - name: EXCHANGE
            description: "Exchange where listed"
          - name: SECTOR
            description: "Market sector"
          - name: INDUSTRY
            description: "Industry classification"
          - name: LIST_DATE
            description: "IPO / listing date"
          - name: IS_ACTIVE
            description: "Whether security is actively traded"
